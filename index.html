<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<title>ELVOR — High-End Luxury Timepieces</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#030303;color:#e5e5e5;line-height:1.7;overflow-x:hidden}

header{position:sticky;top:0;z-index:100;padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:rgba(3,3,3,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.08)}
.logo{font-family:'Cinzel',serif;font-size:24px;font-weight:600;letter-spacing:8px;color:#fff;text-decoration:none;transition:opacity .3s}
.logo:hover{opacity:.8}
nav{display:flex;gap:24px;flex-wrap:wrap}
nav a{color:#aaa;text-decoration:none;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:color .3s}
nav a:hover{color:#fff}

.hero{text-align:center;padding:110px 20px;background:radial-gradient(circle at center, rgba(30,30,30,0.6) 0%, rgba(3,3,3,1) 80%);border-bottom:1px solid rgba(255,255,255,0.05)}
.eyebrow{color:#c5a880;font-size:10px;letter-spacing:5px;text-transform:uppercase;font-weight:500;margin-bottom:15px}
.hero h1{font-family:'Cinzel',serif;font-size:clamp(36px,7vw,68px);letter-spacing:8px;font-weight:400;line-height:1.2;margin:0 0 20px;color:#fff}
.hero p{color:#888;margin:0 auto 35px;max-width:500px;font-size:14px;letter-spacing:1px}

.button{display:inline-block;background:transparent;color:#fff;padding:14px 28px;border:1px solid rgba(255,255,255,0.3);text-decoration:none;font-weight:500;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .4s cubic-bezier(0.16, 1, 0.3, 1)}
.button:hover{background:#fff;color:#030303;border-color:#fff;box-shadow:0 0 25px rgba(255,255,255,0.15)}

section{padding:80px 6%}
.heading{text-align:center;margin-bottom:50px}
.heading h2{font-family:'Cinzel',serif;font-size:clamp(24px,4vw,34px);font-weight:400;letter-spacing:4px;color:#fff}
.heading p{color:#777;font-size:12px;margin-top:10px;letter-spacing:1px}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;max-width:1200px;margin:auto}
.product{background:#0a0a0a;border:1px solid rgba(255,255,255,0.06);padding:20px;display:flex;flex-direction:column;transition:border-color .4s, transform .4s}
.product:hover{border-color:rgba(197,168,128,0.4);transform:translateY(-4px)}
.product img.main{width:100%;height:320px;object-fit:contain;background:#060606;padding:10px}
.tag{color:#c5a880;font-size:9px;letter-spacing:3px;margin-top:15px;text-transform:uppercase;font-weight:500}
